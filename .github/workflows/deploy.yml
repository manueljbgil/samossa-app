name: Deploy

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for development
        if: github.ref_name == 'develop'
        run: npm run build:development
        env:
          APP_ENV: development
          PORT: ${{ vars.PORT || '3000' }}
          DATABASE_FILE: ${{ vars.DATABASE_FILE || './data.dev.db' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}

      - name: Build for production
        if: github.ref_name == 'main'
        run: npm run build:production
        env:
          APP_ENV: production
          PORT: ${{ vars.PORT || '3000' }}
          DATABASE_FILE: ${{ vars.DATABASE_FILE || './data.prod.db' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist-${{ github.ref_name }}
          path: dist/

  deploy-development:
    name: Deploy Development (QA)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'develop'
    environment: development

    steps:
      - name: Deploy development bundle
        run: |
          if [ -z "${DEV_DEPLOY_WEBHOOK_URL}" ]; then
            echo "DEV_DEPLOY_WEBHOOK_URL is not set for the development environment."
            exit 1
          fi
          curl -fsSL -X POST "$DEV_DEPLOY_WEBHOOK_URL"
        env:
          DEV_DEPLOY_WEBHOOK_URL: ${{ secrets.DEV_DEPLOY_WEBHOOK_URL }}

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main'
    environment: production

    steps:
      - name: Deploy production bundle
        run: |
          if [ -z "${PROD_DEPLOY_WEBHOOK_URL}" ]; then
            echo "PROD_DEPLOY_WEBHOOK_URL is not set for the production environment."
            exit 1
          fi
          curl -fsSL -X POST "$PROD_DEPLOY_WEBHOOK_URL"
        env:
          PROD_DEPLOY_WEBHOOK_URL: ${{ secrets.PROD_DEPLOY_WEBHOOK_URL }}
