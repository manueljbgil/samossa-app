app = "samossa-api-qa"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "development"
  NODE_ENV = "production"
  SERVE_CLIENT = "false"
  CORS_ALLOWED_ORIGINS = "https://qa--samosa-qa.netlify.app,http://localhost:3000"
  PORT = "3000"
  DATABASE_FILE = "/data/data.qa.db"

[[mounts]]
  source = "samossa_data_qa"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
